<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="830" viewBox="0 0 1664 830" role="img" aria-label="A scatter plot of the centre-metric temperature against the wire proxy, for one reference layout and five team runs, each with its prediction. Reference: 115.94 degrees at 9.38 mm. D1, on staging: 113.23 degrees at 9.35 mm, predicted about 113.3. T1, on production: 108.85 degrees at 10 mm, predicted about 108.7. T2: 104.62 degrees at 11 mm, predicted about 104.5. T3: 98.29 degrees at 12.75 mm, predicted about 98.4. T4: 96.51 degrees at 14 mm, predicted about 96.7. D1 is 2.71 degrees cooler than the reference on less wire by our proxy; T4 is 19.43 degrees cooler on 1.49 times the wire proxy; every prediction, recorded before these runs, landed within 0.2 degrees. Each dot is one team run, reproduced by a fresh-process replay: HotSpot 6.0 binary 751b357f, grid 64. Simulated, not silicon; this build has a known heat-balance limit. Not a frontier or an optimum: an adaptive search that stopped early chose these points. Proxy wire, so no beat, and not comparable with the paper's routed-wire numbers." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="830" fill="#0c1317"/><circle cx="10" cy="22" r="9" fill="#199e70"/><text x="28.0" y="30.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >scored on production</text><circle cx="300" cy="22" r="9" fill="#3987e5"/><text x="318.0" y="30.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >scored on staging</text><path d="M560 12 L570 22 L560 32 L550 22 Z" fill="none" stroke="#f0efec" stroke-width="2"/><text x="580.0" y="30.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >predicted before the run</text><rect x="870" y="13" width="18" height="18" fill="none" stroke="#f0c27a" stroke-width="3"/><text x="898.0" y="30.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >reference 
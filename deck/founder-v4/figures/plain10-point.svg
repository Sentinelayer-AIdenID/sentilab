<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="620" viewBox="0 0 1664 620" role="img" aria-label="A loop of three boxes: the agent proposes, the simulator scores, and the agent chases the score. The simulator box is highlighted with the question Who checks this one. Below, in large type: Check the grader before celebrating the score." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="620" fill="#0c1317"/><rect x="0" y="70" width="480" height="200" rx="16" fill="#121c23" stroke="#3a4a55" stroke-width="2"/><text x="240.0" y="162.0" font-size="52" fill="#f0efec" font-weight="700" text-anchor="middle" >Agent</text><text x="240.0" y="220.0" font-size="34" fill="#c3c2b7" font-weight="400" text-anchor="middle" >proposes</text><rect x="592" y="70" width="480" height="200" rx="16" fill="#121c23" stroke="#f0c27a" stroke-width="4"/><text x="832.0" y="162.0" font-size="52" fill="#f0c27a" font-weight="700" text-anchor="middle" >Simulator</text><text x="832.0" y="220.0" font-size="34" fill="#c3c2b7" font-weight="400" text-anchor="middle" >scores</text><rect x="1184" y="70" width="480" height="200" rx="16" fill="#121c23" stroke="#3a4a55" stroke-width="2"/><text x="1424.0" y="162.0" font-size="52" fill="#f0efec" font-weight="700" text-anchor="middle" >Agent</text><text x="1424.0" y="220.0" font-size="34" fill="#c3c2b7" font-weight="400" text-anchor="middle" >chases the score</text><line x1="484" y1="170.0" x2="566" y2="170.0" stroke="#f0efec" stroke-width="5" stroke-linecap="round"/><path d="M562 154.0 L586 170.0 L562 186.0 Z" fill="#f0efec"/><line x1="1076" y1="170.0" x2="1158" y2="170.0" stroke="#f0efec" stroke-width="5" stroke-linecap="round"/><path d="M1154 154.0 L1178 170.0 L1154 186.0 Z" fill="#f0efec"/><text x="832.0" y="42.0" font-size="34" fill="#f0c27a" font-weight="700" text-anchor="middle" >Who checks this one?</text><text x="832.0" y="416.0" font-size="88" fill="#f0efec" font-weight="700" text-anchor="middle" >Check the grader</text><text x="832.0" y="520.0" font-size="88" fill="#f0efec" font-weight="700" text-anchor="middle" >before celebrating the score.</text></svg>
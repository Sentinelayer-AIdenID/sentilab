<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="700" viewBox="0 0 1664 700" role="img" aria-label="Three versions against three checks on the CPU-DRAM design. Older version, our pinned 6.0 build: 0.01 degrees off the paper, passing the 1 degree bar set in advance; heat out exceeds heat in by 1.39 percent, failing the balance check; 6.3 degrees from three separate solvers. Newer version 7.0: 117 degrees off the paper, failing; heat balances within rounding; 102 degrees from the solvers. Newer version with one step changed, our own run, with the same result reported by Delfie and ScienceClaw: 9.6 degrees off the paper, failing; heat balances within rounding; 3.3 degrees from the solvers. Saved 45 mm, grid 64 CPU-DRAM cases, simulated, not compared with a real chip. The heat check's rounding limit is about 0.43 watts, 0.063 percent, and is not a total error bound. Each column uses its own reading. The paper column uses the native all-block reading, 232.67 degrees for 7.0. The solver column uses the hottest chiplet entry, 224.67 degrees for 7.0, against die-centre values from two finite-element implementations, one ours, and one separate finite-volume implementation." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="700" fill="#0c1317"/><text x="470.0" y="44.0" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start" >Matches the paper's number?</text><text x="470.0" y="80.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >bar set first: within 1 degree</text><text x="860.0" y="44.0" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start" >Heat in equals heat out?</text><text x="860.0" y="80.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >saved-field check: within rounding</text><text x="1250.0" y="44.0" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start" >Distance from 3 separate solvers</text><text x="1250.0" y="80.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >no bar: model against model</text><rect x="0" y="104" width="1664" height="144" rx="10" fill="#121c23"/><text x="24.0" y="188.0" font-size="30" fill="#f0efec" font-weight="600" text-anchor="start" >Older: our pinned 6.0 build</text><circle cx="496" cy="176.0" r="22" fill="#10332a" stroke="#199e70" stroke-width="2"/><polyline points="485,177.0 493,185.0 508,167.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="536.0" y="189.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >0.01 degrees off</text><circle cx="886" cy="176.0" r="22" fill="#3a1f14" stroke="#d95926" stroke-width="2"/><path d="M877 167.0 L895 185.0 M895 167.0 L877 185.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round"/><text x="926.0" y="189.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >+1.39%</text><text x="1250.0" y="189.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >6.3 degrees</text><rect x="0" y="260" width="1664" height="144" rx="10" fill="#121c23"/><text x="24.0" y="344.0" font-size="30" fill="#f0efec" font-weight="600" text-anchor="start" >Newer: 7.0</text><circle cx="496" cy="332.0" r="22" fill="#3a1f14" stroke="#d95926" stroke-width="2"/><path d="M487 323.0 L505 341.0 M505 323.0 L487 341.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round"/><text x="536.0" y="345.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >117 degrees off</text><circle cx="886" cy="332.0" r="22" fill="#10332a" stroke="#199e70" stroke-width="2"/><polyline points="875,333.0 883,341.0 898,323.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="926.0" y="345.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >−0.02%</text><text x="1250.0" y="345.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >102 degrees</text><rect x="0" y="416" width="1664" height="144" rx="10" fill="#121c23"/><text x="24.0" y="478.0" font-size="30" fill="#f0efec" font-weight="600" text-anchor="start" >Newer, one step changed</text><text x="24.0" y="518.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >our run; also Delfie and ScienceClaw</text><circle cx="496" cy="488.0" r="22" fill="#3a1f14" stroke="#d95926" stroke-width="2"/><path d="M487 479.0 L505 497.0 M505 479.0 L487 497.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round"/><text x="536.0" y="501.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >9.6 degrees off</text><circle cx="886" cy="488.0" r="22" fill="#10332a" stroke="#199e70" stroke-width="2"/><polyline points="875,489.0 883,497.0 898,479.0" fill="none" stroke="#f0efec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="926.0" y="501.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >−0.02%</text><text x="1250.0" y="501.0" font-size="36" fill="#f0efec" font-weight="700" text-anchor="start" >3.3 degrees</text><text x="0.0" y="628.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >Saved 45 mm, grid 64 CPU-DRAM cases, simulated. Nothing here is compared with a real chip. Rounding limit: about 0.43 W, 0.063%; not a total error bound.</text><text x="0.0" y="660.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >Paper column: native all-block reading (232.67 for 7.0). Solver column: hottest chiplet entry (224.67 for 7.0), against die-centre values</text><text x="0.0" y="692.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >from two finite-element implementations, one ours, and one separate finite-volume implementation. Each column uses its own reading.</text></svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SentiLab · founder pitch (v4)</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<!-- Every slide is generated by deck.js from deck-data.json (scripts/build-deck-founder.mjs builds it from
     docs/sentilab/deck/founder-v4/V4.json). The pictures are files in figures/, written by the same build. -->
<main id="deck" aria-live="polite"></main>

<aside id="notes" hidden>
  <div class="n-head"><span class="n-pos"></span><span class="n-target"></span><span class="n-clock"></span><span class="n-keys">N notes · R reset clock · F fullscreen</span></div>
  <p class="n-text"></p>
  <p class="n-cue"></p>
</aside>

<script src="deck-data.js"></script>
<script src="deck.js"></script>
</body>
</html>

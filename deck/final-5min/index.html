<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SentiLab · five-minute deck</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<!-- Every slide is generated by deck.js from deck-data.json (scripts/build-deck-final.mjs builds it from
     docs/sentilab/deck/final-5min/FINAL.json). The figures are SVG files in figures/, written by the same build and shown as images. -->
<main id="deck" aria-live="polite"></main>


<aside id="notes" hidden>
  <div class="n-head"><span class="n-pos"></span><span class="n-target"></span><span class="n-clock"></span><span class="n-keys">N notes · R reset clock · F fullscreen</span></div>
  <p class="n-text"></p>
</aside>

<script src="deck-data.js"></script>
<script src="deck.js"></script>
</body>
</html>

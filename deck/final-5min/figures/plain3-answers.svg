<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="450" viewBox="0 0 1664 450" role="img" aria-label="The paper's own temperature reading, not the hottest spot. One design, every answer on one line: the published answer, our rerun of the older version and another team's rerun all read 116 degrees C, inside the pass mark set in advance. Two independent solvers read 122, close but not identical. The newer version reads 233." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="450" fill="#0c1317"/><line x1="30.0" x2="1630.0" y1="270" y2="270" stroke="#3a4a55" stroke-width="2"/><line x1="69.0" x2="69.0" y1="264" y2="276" stroke="#3a4a55"/><text x="69.0" y="306.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >50 °C</text><line x1="459.3" x2="459.3" y1="264" y2="276" stroke="#3a4a55"/><text x="459.3" y="306.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >100 °C</text><line x1="849.5" x2="849.5" y1="264" y2="276" stroke="#3a4a55"/><text x="849.5" y="306.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >150 °C</text><line x1="1239.8" x2="1239.8" y1="264" y2="276" stroke="#3a4a55"/><text x="1239.8" y="306.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >200 °C</text><line x1="1630.0" x2="1630.0" y1="264" y2="276" stroke="#3a4a55"/><text x="1630.0" y="306.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="end" >250 °C</text><rect x="575.9" y="226" width="15.6" height="88" rx="2" fill="#3987e5" opacity="0.28"/><line x1="583.7" x2="583.7" y1="270" y2="204" stroke="#3a4a55"/><text x="573.7" y="112.0" font-size="26" fill="#c3c2b7" font-weight="400" text-anchor="end" >The published answer: 116</text><line x1="583.7" x2="583.7" y1="270" y2="204" stroke="#3a4a55"/><text x="573.7" y="150.0" font-size="26" fill="#f0efec" font-weight="600" text-anchor="end" >Our rerun of the older version: 116</text><line x1="583.7" x2="583.7" y1="270" y2="204" stroke="#3a4a55"/><text x="573.7" y="188.0" font-size="26" fill="#c3c2b7" font-weight="400" text-anchor="end" >Another team's rerun of it: 116</text><circle cx="583.7" cy="270" r="11" fill="#3987e5" stroke="#0c1317" stroke-width="2"/><line x1="632.9" x2="632.9" y1="270" y2="332" stroke="#3a4a55"/><text x="644.9" y="336.0" font-size="26" fill="#f0efec" font-weight="600" text-anchor="start" >2 independent solvers: 122</text><text x="644.9" y="368.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Close, not identical. That gap is still open.</text><circle cx="632.9" cy="270" r="11" fill="#199e70" stroke="#0c1317" stroke-width="2"/><line x1="1494.7" x2="1494.7" y1="270" y2="204" stroke="#3a4a55"/><text x="1504.7" y="160.0" font-size="32" fill="#f0efec" font-weight="700" text-anchor="end" >Newer version: 233</text><text x="1504.7" y="194.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="end" >ours and another team's</text><circle cx="1494.7" cy="270" r="11" fill="#d95926" stroke="#0c1317" stroke-width="2"/><text x="30.0" y="30.0" font-size="26" fill="#c3c2b7" font-weight="400" text-anchor="start" >The paper's own temperature reading, not the hottest spot</text><rect x="30.0" y="416" width="22" height="26" rx="2" fill="#3987e5" opacity="0.4"/><text x="62.0" y="437.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Pass mark set in advance: within 1 degree of the published answer</text></svg>
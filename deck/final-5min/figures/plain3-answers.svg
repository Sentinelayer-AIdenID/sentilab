<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="730" viewBox="0 0 1664 730" role="img" aria-label="The paper's own temperature reading, not the hottest spot. One design, every answer on one line: the published answer, our rerun of the older version and the reruns by Delfie and ScienceClaw all read 116 degrees C, inside the pass mark set in advance. Two separate finite-element implementations read 122, close but not identical. The newer version reads 233, and with one step changed, as Delfie reports, and ScienceClaw reports it too, it reads 126. Zoomed in, our rerun sits on the published answer for both published designs: 115.93 against 115.94, and 75.48 against 75.48, both within the 1 degree pass mark." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="730" fill="#0c1317"/><line x1="30.0" x2="1630.0" y1="276" y2="276" stroke="#3a4a55" stroke-width="2"/><line x1="69.0" x2="69.0" y1="270" y2="282" stroke="#3a4a55"/><text x="69.0" y="312.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >50 °C</text><line x1="459.3" x2="459.3" y1="270" y2="282" stroke="#3a4a55"/><text x="459.3" y="312.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >100 °C</text><line x1="849.5" x2="849.5" y1="270" y2="282" stroke="#3a4a55"/><text x="849.5" y="312.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >150 °C</text><line x1="1239.8" x2="1239.8" y1="270" y2="282" stroke="#3a4a55"/><text x="1239.8" y="312.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" >200 °C</text><line x1="1630.0" x2="1630.0" y1="270" y2="282" stroke="#3a4a55"/><text x="1630.0" y="312.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="end" >250 °C</text><rect x="575.9" y="232" width="15.6" height="88" rx="2" fill="#3987e5" opacity="0.28"/><line x1="583.7" x2="583.7" y1="276" y2="210" stroke="#3a4a55"/><text x="573.7" y="118.0" font-size="26" 
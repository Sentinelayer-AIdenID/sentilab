<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="760" viewBox="0 0 1664 760" role="img" aria-label="Map of what travelled between SentiLab and eight outside teams. Used it and returned a result: Delfie, ScienceClaw, An outside team. Said it helped: An outside team, An outside team. Not confirmed yet: An outside team, An outside team, An outside team. Between other teams: Delfie to An outside team: physics anchors; ScienceClaw to An outside team: fracture package; ScienceClaw to An outside team: blind solve, compared; An outside team to An outside team: evaluation notes." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="760" fill="#0c1317"/><defs><marker id="arrow-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#199e70"/></marker></defs><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3987e5"/></marker></defs><defs><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#98968f"/></marker></defs><line x1="752.7" y1="296.6" x2="345.1" y2="123.7" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><line x1="338.1" y1="140.3" x2="745.6" y2="313.1" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><text x="590.0" y="170.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">public test case</text><line x1="832.0" y1="250.0" x2="832.0" y2="132.0" stroke="#98968f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-grey)"/><text x="846.0" y="200.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">rigidity tool</text><line x1="918.4" y1="313.1" x2="1325.9" y2="140.3" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><line x1="1318.9" y1="123.7" x2="911.3" y2="296.6" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><text x="1074.0" y="170.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">public case, review</text><line x1="922.0" y1="349.0" x2="1286.0" y2="349.0" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><line x1="1286.0" y1="331.0" x2="922.0" y2="331.0" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><text x="1116.0" y="318.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">benchmark, public case</text><line x1="914.9" y1="375.1" x2="1322.4" y2="548.0" stroke="#199e70" stroke-width="3" marker-end="url(#arrow-aqua)"/><text x="1074.0" y="532.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">shot-cost points</text><line x1="832.0" y1="430.0" x2="832.0" y2="548.0" stroke="#98968f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-grey)"/><text x="846.0" y="490.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">test harness</text><line x1="749.1" y1="375.1" x2="341.6" y2="548.0" stroke="#98968f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-grey)"/><text x="590.0" y="532.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">dataset search</text><line x1="742.0" y1="340.0" x2="378.0" y2="340.0" stroke="#199e70" stroke-width="3" marker-end="url(#arrow-aqua)"/><text x="580.0" y="322.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">answers, knowledge base</text><line x1="378.0" y1="66.0" x2="640.0" y2="66.0" stroke="#3987e5" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="509.0" y="52.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">physics anchors</text><line x1="1286.0" y1="66.0" x2="1024.0" y2="66.0" stroke="#3987e5" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="1155.0" y="52.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">fracture package</text><line x1="1478.0" y1="132.0" x2="1478.0" y2="274.0" stroke="#3987e5" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="1462.0" y="212.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="end" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">blind solve, compared</text><line x1="378.0" y1="614.0" x2="640.0" y2="614.0" stroke="#3987e5" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="509.0" y="600.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="middle" style="paint-order:stroke" stroke="#0c1317" stroke-width="8">evaluation notes</text><circle cx="832" cy="340" r="84" fill="#0c1317" stroke="#f0efec" stroke-width="3"/><text x="832.0" y="351.0" font-size="32" fill="#f0efec" font-weight="700" text-anchor="middle" >SentiLab</text><rect x="0.0" y="6.0" width="372" height="120" rx="12" fill="#121c23" stroke="#199e70" stroke-width="3"/><text x="20.0" y="46.0" font-size="32" fill="#f0efec" font-weight="600" text-anchor="start" >Delfie</text><text x="20.0" y="78.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Both versions on our case in</text><text x="20.0" y="108.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >39 min. Then tested one change</text><rect x="646.0" y="6.0" width="372" height="120" rx="12" fill="#0c1317" stroke="#3a4a55" stroke-width="2" stroke-dasharray="7 7"/><text x="666.0" y="46.0" font-size="32" fill="#c3c2b7" font-weight="600" text-anchor="start" >An outside team</text><text x="666.0" y="78.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >Ran through the open-source</text><text x="666.0" y="108.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >ScienceClaw registry, executor</text><rect x="1292.0" y="6.0" width="372" height="120" rx="12" fill="#121c23" stroke="#199e70" stroke-width="3"/><text x="1312.0" y="46.0" font-size="32" fill="#f0efec" font-weight="600" text-anchor="start" >ScienceClaw</text><text x="1312.0" y="78.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Re-ran our case: same numbers.</text><text x="1312.0" y="108.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Used our review on its package</text><rect x="1292.0" y="280.0" width="372" height="120" rx="12" fill="#121c23" stroke="#199e70" stroke-width="3"/><text x="1312.0" y="320.0" font-size="32" fill="#f0efec" font-weight="600" text-anchor="start" >An outside team</text><text x="1312.0" y="352.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Separate solver on our</text><text x="1312.0" y="382.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >case, in 1 h 41</text><rect x="1292.0" y="554.0" width="372" height="120" rx="12" fill="#121c23" stroke="#199e70" stroke-width="1.5"/><text x="1312.0" y="594.0" font-size="32" fill="#f0efec" font-weight="600" text-anchor="start" >An outside team</text><text x="1312.0" y="626.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >“Thanks, very useful”</text><text x="1312.0" y="656.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Result not shown</text><rect x="646.0" y="554.0" width="372" height="120" rx="12" fill="#0c1317" stroke="#3a4a55" stroke-width="2" stroke-dasharray="7 7"/><text x="666.0" y="594.0" font-size="32" fill="#c3c2b7" font-weight="600" text-anchor="start" >An outside team</text><text x="666.0" y="626.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >Asked for it.</text><text x="666.0" y="656.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >Use not confirmed yet</text><rect x="0.0" y="554.0" width="372" height="120" rx="12" fill="#0c1317" stroke="#3a4a55" stroke-width="2" stroke-dasharray="7 7"/><text x="20.0" y="594.0" font-size="32" fill="#c3c2b7" font-weight="600" text-anchor="start" >An outside team</text><text x="20.0" y="626.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >“glad to have another</text><text x="20.0" y="656.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >agent on it”</text><rect x="0.0" y="280.0" width="372" height="120" rx="12" fill="#121c23" stroke="#199e70" stroke-width="1.5"/><text x="20.0" y="320.0" font-size="32" fill="#f0efec" font-weight="600" text-anchor="start" >An outside team</text><text x="20.0" y="352.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >“Yes, yours helped.”</text><text x="20.0" y="382.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Then it corrected a claim of ours</text><line x1="6" x2="50" y1="726" y2="726" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><line x1="50" x2="6" y1="744" y2="744" stroke="#199e70" stroke-width="4" marker-end="url(#arrow-aqua)"/><text x="60.0" y="742.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >3 checked our thermal case</text><line x1="438" x2="482" y1="735" y2="735" stroke="#199e70" stroke-width="3" marker-end="url(#arrow-aqua)"/><text x="492.0" y="742.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >2 said other help was useful</text><line x1="854" x2="898" y1="735" y2="735" stroke="#98968f" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-grey)"/><text x="908.0" y="742.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >3 haven't confirmed yet</text><line x1="1264" x2="1308" y1="735" y2="735" stroke="#3987e5" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="1318.0" y="742.0" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >between other teams</text></svg>
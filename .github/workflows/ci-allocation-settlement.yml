name: CI allocation terminal settlement
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # workflow_run loads trusted default-branch code. Downloaded PR data is never executed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read settlement if the runner survived
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: allocation-settlement-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/allocation-terminal/download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Bind terminal conclusion to durable admission, preserving unknowns
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BOOTSTRAP_AUTHORIZATION: ${{ vars.CI_BOOTSTRAP_AUTHORIZATION }}
          CI_ALLOCATION_SELECTION: ${{ vars.CI_ALLOCATION_SELECTION }}
        run: python3 -m scripts.ci_reconcile "$RUNNER_TEMP/allocation-terminal"
      - name: Upload terminal witness even after runner loss
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allocation-terminal-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/allocation-terminal/terminal.json
          if-no-files-found: error
          retention-days: 90

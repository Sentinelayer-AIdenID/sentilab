name: CI
# The container build is the test: it runs the controller tests, the demo numbers and a HotSpot+SuperLU probe
# (scripts/container_smoke.sh) and fails if any of them fails. Browser verification runs from source separately.
# The secret scan covers the full history.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the Python signing fixture dependency
        run: python -m pip install "$(grep '^cryptography==' requirements.txt)"
      - name: Verify browser trust and Python record compatibility (ephemeral keys)
        run: node --test web/test/*.test.mjs

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image (runs the smoke tests)
        run: docker build --build-arg BUILD_SHA=${{ github.sha }} -t thermal-api:ci .
      - name: Health endpoint answers with the build SHA
        run: |
          docker run -d --name api -p 8000:8000 thermal-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"build_sha":"${{ github.sha }}"'
      - name: Origin lock refuses callers without the token
        run: |
          token="$(openssl rand -hex 16)"  # per run: no token-shaped literal in the repo
          docker run -d --name locked -p 8001:8000 -e ORIGIN_SHARED_TOKEN="$token" thermal-api:ci
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8001/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/health)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "x-origin-token: $(openssl rand -hex 16)" http://127.0.0.1:8001/api/health)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "x-origin-token: $token" http://127.0.0.1:8001/api/health)" = 200

  contracts:
    # The evidence/ResultCheck contract (v0.2) and the view envelope (v0.4) are executable: their vector runners must
    # pass, and every file must still match the hash the reviewers +1'd (contracts/HASHES.txt).
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Files match their reviewed hashes
        run: cd contracts && sha256sum -c HASHES.txt
      - name: Contract vectors
        run: |
          node --version
          (cd contracts/contract-0.2 && node run-vectors.mjs)
          (cd contracts/view-envelope && node run-view-vectors.mjs)
          (cd contracts/view-envelope-v0.5 && node run-view-vectors.mjs)
      - name: Lab view matches the contracts (browser copies, demo fixture)
        run: |
          node --test web/test/sentilab-parity.test.mjs
          node web/test/make-sentilab-demo.mjs --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the Python signing fixture dependency
        run: python -m pip install "$(grep '^cryptography==' requirements.txt)"
      - name: Memory projection matches the pinned JavaScript contract
        run: |
          node --version
          python -m unittest -q sentilab_core.memory_conformance

  live-conformance:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Python canonical and live state match the pinned JavaScript contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest -q sentilab_core.conformance

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 detect --source /repo --no-banner --redact --exit-code 1

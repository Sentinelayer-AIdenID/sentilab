name: CI allocation admission
on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # atomic create-only allocation refs, never available to CI
      actions: read
      pull-requests: read # authenticate head/base/merge metadata for private PRs
    steps:
      # workflow_run's github.sha is the trusted default-branch snapshot.
      # Never check out the upstream run's source or download its artifacts here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reserve from authenticated upstream run and merge metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci_admit --workflow-run "$RUNNER_TEMP/allocation/admission.json"
      - name: Preserve trusted admission or refusal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allocation-owner-admission-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/allocation/admission.json
          if-no-files-found: error
          retention-days: 90

# SentiLab change notice (Apache-2.0 section 4(b)): derived from upstream TAP-2.5D
# configs/sys_micro150.cfg (bu-icsg/TAP-2.5D 3a3f4e5) for SLAB-048. Changed: intp_size 50 -> 45
# (the paper's interposer, Sec. IV), LF line endings, and the [sentilab] section at the end.
# path is upstream's own ./. Dies, powers and connections are unchanged from the 50 mm fixture.
[general]
path = ./
placer_granularity = 1
initial_placement = bstree
decay = 0.8

[interposer]
# we will support passive, active, (photonic), and EMIB options.
intp_type = passive
intp_size = 45
link_type = nppl

[chiplets]
chiplet_count = 8
widths = 	8.25,	8.25,	8.25,	8.25,	8.75,	8.75,	8.75,	8.75
heights = 	9,		9,		9,		9,		8.75,	8.75,	8.75,	8.75
powers = 	150,	150,	150,	150,	20,		20,		20,		20

connections = 0,	256,	0,	256,	1024,	0,	0,	0;
			256,	0,	256,	0,	0,	1024,	0,	0;
			0,	256,	0,	256,	0,	0,	1024,	0;
			256,	0,	256,	0,	0,	0,	0,	1024;
			1024,	0,	0,	0,	0,	0,	0,	0;
			0,	1024,	0,	0,	0,	0,	0,	0;
			0,	0,	1024,	0,	0,	0,	0,	0;
			0,	0,	0,	1024,	0,	0,	0,	0

[sentilab]
# SentiLab legality, read by sundai_hotspot/tap_oracle.py; TAP itself ignores this section.
# Die centres sit on a 0.5 mm lattice so the SAMPLED +/-0.5 mm probes of the snapped reference
# are legal. TAP's 1 mm placer_granularity above still sets the generated edge strips.
center_lattice_mm = 0.5
# TAP-2.5D Eqn. (10): at least 0.1 mm between die bodies, on top of the halo clearance.
min_die_gap_mm = 0.1
# Any non-square die may be turned 90 degrees (TAP's rotate move).
rotation = per_die_90

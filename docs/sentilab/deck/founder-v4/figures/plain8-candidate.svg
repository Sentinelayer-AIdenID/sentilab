<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="860" viewBox="0 0 1664 860" role="img" aria-label="Two chip layouts drawn to scale on a 45 mm square, with its empty top and bottom cropped. Left, the paper's layout as we reconstructed it: memory 9.35 mm from each CPU, CPUs 9.15 by 9.9 mm apart. Right, our agent's layout: memory 9.0 mm from each CPU, CPUs 10.5 by 11 mm apart, with dashed outlines showing where each chip was. Memory links carry 1,024 wires each and CPU links 256. The result: 2.71 degrees cooler, from 115.94 to 113.23 degrees at the hottest chiplet centre; wire proxy 9.38 to 9.35 mm, not routed wire; active peak 115.70 against a limit of 119.07; the same answer on a fresh-process replay, 3.5 seconds from queued to done by the public event stamps; predicted first at about 113.3 degrees, posted before the run. Simulated with HotSpot 6.0, grid 64, a difference between two simulations, not a chip measurement. Because the wire is a proxy, this is a candidate, not a beat. This build has a known heat-balance limit. One team run on staging, run aaab." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="860" fill="#0c1317"/><text x="0.0" y="36.0" font-size="30" fill="#f0efec" font-weight="700" text-anchor="start" >The paper's layout, reconstructed</text><text x="0.0" y="68.0" font-size="24" fill="#98968f" font-weight="400" text-anchor="start" >memory 9.35 mm away, CPUs 9.15 by 9.9 mm apart</text><rect x="0" y="84.0" width="800.0" height="444.4" rx="10" fill="#121c23" stroke="#3a4a55" stroke-width="2"/><rect x="245.3" y="314.2" width="146.7" height="160.0" rx="6" fill="#d95926"/><rect x="408.0" y="314.2" width="146.7" height="160.0" rx="6" fill="#d95926"/><rect x="408.0" y="138.2" width="146.7" height="160.0" rx="6" fill="#d95926"/><rect x="245.3" y="138.2" width="146.7" height="160.0" rx="6" fill="#d95926"/><rect x="74.7" y="316.5" width="155.6" height="155.6" rx="6" fill="#2b3d49"/><rec
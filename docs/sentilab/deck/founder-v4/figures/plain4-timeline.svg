<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="690" viewBox="0 0 1664 690" role="img" aria-label="One lane per actor. A person asks at 12:43 why the study came out inconclusive. Three agents post sealed notes between 13:08 and 13:15: agent 3 shows the setup heats up far more than the paper, and agent 1, 32 minutes after the question, names a suspect; agent 2 confirms it at 13:28. Agent 4, run by another person, models it from public code at 14:26. Agent 2 shows the gap in saved results at 14:42. At 15:52 agent 1 proposes stopping the group's own public run; agents 3 and 2 agree; it stops under 5 minutes after the proposal. The numbers are taken back in public at 16:40. Agent 3 posts the public test case at 22:22. Delfie reproduces it at 23:01, 39 minutes after. The test set in advance passes at 23:44. A separate solver follows at 00:03, 1 hour 41 after." font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="1664" height="690" fill="#0c1317"/><rect x="0" y="92" width="1664" height="92" fill="#121c23"/><line x1="192.0" x2="1123.2" y1="138.0" y2="138.0" stroke="#22303a" stroke-width="2"/><line x1="1193.2" x2="1650.0" y1="138.0" y2="138.0" stroke="#22303a" stroke-width="2"/><text x="12.0" y="147.0" font-size="26" fill="#f0efec" font-weight="600" text-anchor="start" >A person</text><line x1="192.0" x2="1123.2" y1="230.0" y2="230.0" stroke="#22303a" stroke-width="2"/><line x1="1193.2" x2="1650.0" y1="230.0" y2="230.0" stroke="#22303a" stroke-width="2"/><text x="12.0" y="239.0" font-size="26" fill="#f0efec" font-weight="600" text-anchor="start" >Agent 1</text><rect x="0" y="276" width="1664" height="92" fill="#121c23"/><line x1="192.0" x2="1123.2" y1="322.0" y2="322.0" stroke="#22303a" stroke-width="2"/><line x1="1193.2" x2="1650.0" y1="322.0" y2="322.0" stroke="#22303a" stroke-width="2"/><text x="12.0" y="331.0" font-size="26" fill="#f0efec" font-weight="600" text-anchor="start" >Agent 2</text><line x1="192.0" x